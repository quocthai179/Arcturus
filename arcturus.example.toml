# Chép thành arcturus.toml (đã gitignore). Gán tên, vai trò, màu cho từng phiên theo đường dẫn làm việc.
# Phiên không khớp mẫu nào sẽ được đặt tên tự động.

[hub]
bind = "127.0.0.1:7878"
approval_timeout_secs = 110     # phải nhỏ hơn timeout của hook (120)
reconcile_interval_secs = 30
event_ttl_days = 30
handoff_max_bytes = 4096        # lệnh dài hơn (byte) hoặc nhiều dòng hơn: không duyệt ở Arcturus, trả về terminal
handoff_max_lines = 50

[team]
main_roster_max = 5             # đội hình chính; agent rảnh còn lại gom vào "phòng hỗ trợ"

[[persona]]
match_cwd = "**/.claude/worktrees/hub*"
name = "Khoa"
role = "backend"
palette = { hair = "#1F1F24", outfit = "#4C8DF6", acc = "#9AA3B5" }

