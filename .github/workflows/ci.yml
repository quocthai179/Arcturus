name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml chọn kênh stable kèm clippy, rustfmt; rustup có sẵn trên runner.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI (test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phiên bản pnpm lấy từ trường packageManager trong ui/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui test --run
      - run: pnpm -C ui build

  # crates/app (Tauri) KHÔNG build trên CI ở v0: trên Ubuntu cần libwebkit2gtk-4.1, libsoup và các thư viện GTK
  # mà runner không có sẵn, và app không chứa logic nghiệp vụ. Build tay trên máy dev; xem lại ở T12.
