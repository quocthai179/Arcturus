[package]
name = "arcturus-app"
description = "Ứng dụng desktop Arcturus (Tauri 2): tray, popup Lite, văn phòng 2D. Là client của hub."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Workspace riêng: không nằm trong workspace gốc để CI Rust không cần thư viện webview.
[workspace]

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: trình cài đặt giữ nguyên thứ tự khóa trong settings.json của người dùng.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.8.2"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.30.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
