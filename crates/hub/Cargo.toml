[package]
name = "hub"
description = "Daemon Arcturus: nhận hook Claude Code, giữ yêu cầu duyệt, WebSocket cho UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hub-core = { path = "../hub-core" }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }
tokio-tungstenite = "0.30.0"
