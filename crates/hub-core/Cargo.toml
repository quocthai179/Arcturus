[package]
name = "hub-core"
description = "Thư viện thuần của Arcturus: schema sự kiện, state machine, policy, lưu trữ"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
ulid = "3.0.0"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "redactions"] }
