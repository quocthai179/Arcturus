[package]
name = "replay"
description = "Phát lại fixture hook vào hub Arcturus để test không cần Claude Code thật"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true

[dev-dependencies]
hub = { path = "../../crates/hub" }
hub-core = { path = "../../crates/hub-core" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
